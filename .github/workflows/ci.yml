name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop, feature/fastapi-foundation]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contract
      - run: pnpm build
      - run: pnpm secret:scan:test
      - run: pnpm secret:scan
  contracts:
    name: Contract generation and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -r requirements-dev.txt -e packages/python-shared -e apps/api
      - run: pnpm contracts:check
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -r requirements-dev.txt -e packages/python-shared -e apps/api -e apps/worker
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m mypy apps/api/src apps/worker/src packages/python-shared/src
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/python scripts/validate-skills.py
      - run: .venv/bin/python -m unittest tests/test_validate_skills.py -v
  supabase:
    name: Supabase disposable integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: supabase start
      - run: supabase db reset
      - run: node scripts/check-supabase-migrations.mjs
      - run: supabase test db
