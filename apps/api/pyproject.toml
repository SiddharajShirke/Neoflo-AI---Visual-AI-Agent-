[project]
name = "visual-ai-api"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.11",
  "httpx==0.28.1",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "PyJWT[crypto]==2.10.1",
  "uvicorn[standard]==0.34.0",
  "visual-ai-shared"
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
